<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wolly 保活ナビ</title></head><body><title>Wolly 保活ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 絵本の表紙（イラスト）＋本の下半分に6つの入口 → タップで下へスライドして各ページの紹介 → ページをひらく／上へもどる */
:root{
  --floor:#FDD8C8; --floor2:#FBE6DA; --paper:#FDF5E5; --edge:#F2A33A; --ink:#2B4A5E; --teal:#1D8FA6; --muted:#5E7484; --card:#FFFFFF; --line:#E7E2D6;
  --c1:#5CC3EE; --c2:#FF8FB3; --c3:#FFC94A; --c4:#B79CFF;
  --font-display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--floor:#3A2C35;--floor2:#2C2330;--card:#33293A;--ink:#F2EEF6;--muted:#C9BDD0;--line:#4A3D50;color-scheme:dark}}
:root[data-theme="dark"]{--floor:#3A2C35;--floor2:#2C2330;--card:#33293A;--ink:#F2EEF6;--muted:#C9BDD0;--line:#4A3D50;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:linear-gradient(180deg,var(--floor),var(--floor2));color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.75;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:10px}
.nb{display:inline-block}
svg.cute{display:block}

/* ---------- cover ---------- */
.cover{position:relative;max-width:1100px;margin:0 auto;overflow:hidden}
.art{position:relative;width:100%;aspect-ratio:1448/748;overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:breathe 12s ease-in-out infinite;transform-origin:50% 40%}
@keyframes breathe{50%{transform:scale(1.025)}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-6%;width:clamp(8px,1.4vw,16px);height:clamp(6px,1vw,12px);background:#FFC2D6;border-radius:80% 0 80% 0;opacity:.9;animation:fall linear infinite}
.petal.g{background:#B6E37A;border-radius:0 80% 0 80%}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),115vh) rotate(720deg)}}
.twinkle{position:absolute;width:clamp(10px,1.8vw,22px);height:clamp(10px,1.8vw,22px);animation:tw 2.4s ease-in-out infinite}
.twinkle::before{content:"";position:absolute;inset:0;background:#FFE066;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.monkey{position:absolute;left:3%;top:0;width:clamp(56px,11vw,120px);transform-origin:50% 3%;animation:swing 3.2s ease-in-out infinite;z-index:3}
.monkey img{width:100%;height:auto;display:block}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.hello{position:absolute;left:12.5%;top:22%;z-index:3;background:#fff;color:#2B4A5E;font-weight:700;font-size:clamp(11px,1.5vw,15px);border-radius:16px 16px 16px 4px;padding:4px 10px;box-shadow:0 3px 8px rgba(0,0,0,.08);animation:pop 4s ease-in-out infinite}
@keyframes pop{0%,10%{transform:scale(0)}18%,80%{transform:scale(1)}90%,100%{transform:scale(0)}}

/* book bottom with the 6 doors */
.bookb{position:relative;margin:0 14.6% 0 14.9%;background:var(--paper);border-radius:0 0 26px 26px;padding:clamp(10px,2.2vw,22px) clamp(10px,2.5vw,30px) clamp(16px,3vw,30px);
  box-shadow:0 10px 0 -2px var(--edge),0 10px 0 1px #E58E22,0 18px 26px rgba(150,80,30,.18);margin-top:-1px}
.doors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.2vw,14px)}
.door b,.door small{white-space:nowrap;letter-spacing:-.03em}
.door b{font-size:clamp(12px,1.25vw,16px)!important}.door small{line-height:1.35;font-size:clamp(9.5px,.95vw,12px)!important}
.door .dt{min-width:0;max-width:100%}
.door{all:unset;position:relative;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--bgc);border:3px solid #fff;border-radius:22px;padding:clamp(10px,1.6vw,16px) 6px clamp(10px,1.4vw,14px);
  box-shadow:0 5px 0 color-mix(in srgb,var(--cc) 45%,#fff),0 10px 18px rgba(0,0,0,.06);color:#2B4A5E;
  animation:enter .7s cubic-bezier(.3,1.6,.5,1) backwards,bob 3.2s ease-in-out infinite;animation-delay:calc(.4s + var(--d)*.12s),calc(1.2s + var(--d)*.4s);
  transition:transform .28s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
@keyframes enter{from{transform:translateY(30px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{translate:0 -4px}}
.door:hover,.door:focus-visible,.door.fuwa{transform:translateY(-10px) scale(1.08) rotate(-1.5deg);filter:brightness(1.03);box-shadow:0 10px 0 color-mix(in srgb,var(--cc) 45%,#fff),0 18px 26px rgba(0,0,0,.12)}
.door:active{transform:translateY(-4px) scale(.97)}
.door.fuwa .ico{animation:wiggle .6s ease}
@keyframes wiggle{25%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(10deg) scale(1.1)}}
.door::after{content:"";position:absolute;inset:-6px;border-radius:26px;pointer-events:none;opacity:0;box-shadow:0 0 0 0 color-mix(in srgb,var(--cc) 50%,transparent);transition:opacity .3s}
.door:hover::after,.door.fuwa::after{opacity:1;animation:ring 1.2s ease-out infinite}
@keyframes ring{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--cc) 45%,transparent)}to{box-shadow:0 0 0 14px transparent}}
.door .ico{width:clamp(40px,6vw,64px);height:clamp(40px,6vw,64px);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.door:hover .ico,.door:focus-visible .ico{transform:rotate(-10deg) scale(1.12)}
.door b{font-weight:700;font-size:clamp(12px,1.6vw,16px);line-height:1.35}
.door .dt{display:flex;flex-direction:column;gap:2px;line-height:1.35}
.door small{font-size:clamp(10px,1.2vw,12px);color:#5E7484;line-height:1.3}
.paws{display:flex;justify-content:center;gap:28px;padding:30px 0 6px;position:relative}
.paws span{width:28px;height:28px;opacity:0;animation:paw 3s ease-in-out infinite;animation-delay:calc(var(--d)*.45s)}
.paws span:nth-child(odd){transform:translateY(8px) rotate(-12deg)}.paws span:nth-child(even){transform:rotate(12deg)}
@keyframes paw{0%,10%{opacity:0}25%,70%{opacity:.85}100%{opacity:0}}
.hint{text-align:center;font-size:13px;color:var(--muted);font-weight:700;padding-bottom:8px}
.hint i{display:inline-block;animation:down 1.4s ease-in-out infinite;font-style:normal}
@keyframes down{50%{transform:translateY(5px)}}

/* ---------- viewer ---------- */
.viewer{max-width:1100px;margin:10px auto 30px;padding:0 max(10px,env(safe-area-inset-left,0px));scroll-margin-top:6px}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card);border:4px solid color-mix(in srgb,var(--cc) 55%,#fff);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 16px}
.vbar .ico{width:40px;height:40px;flex:0 0 auto;background:var(--bgc);border-radius:14px;padding:4px}
.vbar .tt{flex:1 1 180px;min-width:0}
.vbar .tt small{display:block;font-size:12px;font-weight:700;color:color-mix(in srgb,var(--cc) 70%,var(--ink))}
.vbar .tt b{font-family:var(--font-display);font-weight:400;font-size:clamp(18px,3.6vw,24px);line-height:1.2}
.vbar a{font-size:13px;font-weight:700;color:var(--teal);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--card);transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.vbar a:hover{transform:translateY(-2px) scale(1.05)}
.vframe{position:relative;border:4px solid color-mix(in srgb,var(--cc) 55%,#fff);border-top:3px dashed color-mix(in srgb,var(--cc) 40%,#fff);border-radius:0 0 26px 26px;overflow:hidden;background:#fff;min-height:300px}
.vframe iframe{display:block;width:100%;border:0;height:600px;opacity:0;transform:translateY(40px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,1.2,.4,1)}
.vframe iframe.in{opacity:1;transform:none}
.vframe iframe.out{opacity:0;transform:translateY(-20px);transition:opacity .25s ease,transform .25s ease}
.vload{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.vfoot{display:flex;justify-content:center;padding:14px 0 0}
.door.on{outline:4px solid color-mix(in srgb,var(--cc) 70%,#fff);outline-offset:2px;transform:translateY(-6px) scale(1.04)}
/* floating status bar (embedded pages) */
.fbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:39;width:min(440px,calc(100vw - 90px));display:flex;flex-direction:column;gap:8px;animation:fbin .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes fbin{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.fbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:3px solid var(--fc,#FFC94A);border-radius:999px;padding:5px 14px 5px 6px;box-shadow:0 6px 16px rgba(0,0,0,.16);font-weight:700;font-size:13px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.fbtn:hover{transform:translateY(-2px)}
.fi{width:30px;height:30px;flex:0 0 auto}
.ft{white-space:nowrap}.ft b{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--fc,#FF6FA5)}
.fbtn.roll .ft b{color:#FF9A3D}
.ftrack{flex:1;height:8px;border-radius:99px;background:#EEF0F4;overflow:hidden;min-width:30px}.ftrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ECC85,#3DB2F2);transition:width .4s}
.fv{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto}
.flist{background:var(--card);border:3px solid #E7E2D6;border-radius:20px;padding:10px 12px;max-height:46vh;overflow:auto;box-shadow:0 10px 24px rgba(0,0,0,.16);font-size:13px}
.flist h4{margin:6px 0 4px;font-size:12px;color:var(--muted)}
.flist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.flist li{display:flex;gap:8px;line-height:1.45}.flist li i{flex:0 0 auto;width:18px;height:18px;border-radius:6px;border:2px solid #E7E2D6;font-style:normal;font-size:11px;color:#fff;display:grid;place-items:center;margin-top:1px}
.flist li.ok i{background:#2ECC85;border-color:#2ECC85}.flist li.ok span{color:var(--muted);text-decoration:line-through}
/* ---------- sections ---------- */
.secs{max-width:900px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.sec{scroll-margin-top:60px;background:var(--card);border:4px solid color-mix(in srgb,var(--cc) 55%,#fff);border-radius:30px;padding:20px;position:relative;
  opacity:.001;transform:translateY(60px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,1.2,.4,1)}
.sec.in{opacity:1;transform:none}
.sec.flash{animation:flash .9s ease}
@keyframes flash{30%{box-shadow:0 0 0 10px color-mix(in srgb,var(--cc) 35%,transparent)}}
.sec .top{display:flex;gap:14px;align-items:center}
.sec .top .ico{width:72px;height:72px;flex:0 0 auto;background:var(--bgc);border-radius:22px;padding:8px}
.sec .k{font-weight:700;font-size:13px;color:color-mix(in srgb,var(--cc) 70%,var(--ink))}
.sec h2{font-family:var(--font-display);font-weight:400;font-size:clamp(24px,4.4vw,32px);line-height:1.25;margin:0}
.sec p.lead{margin:12px 0 10px;font-size:15px}
.feats{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.feats li{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--cc) 10%,var(--card));border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.55}
.feats li::before{content:"";flex:0 0 auto;width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--cc)}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-weight:700;font-size:16px;border-radius:999px;padding:11px 24px;background:linear-gradient(90deg,var(--cc),color-mix(in srgb,var(--cc) 60%,#FF8FB3));
  box-shadow:0 5px 0 color-mix(in srgb,var(--cc) 55%,#333);transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.go:hover,.go:focus-visible{transform:translateY(-3px) scale(1.05)}
.up{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.up:hover,.up:focus-visible{transform:translateY(-2px) scale(1.05)}
.more{text-align:center;font-size:13px;color:var(--muted)}
.more a{color:var(--teal);font-weight:700}
.toTop{z-index:41;position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:50px;height:50px;border-radius:50%;border:3px solid #fff;
  background:linear-gradient(135deg,#5CC3EE,#B79CFF);color:#fff;font-weight:700;font-size:11px;line-height:1.1;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.15);
  opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.toTop.on{opacity:1;transform:none;pointer-events:auto}
.toTop:hover{transform:translateY(-3px) scale(1.08)}
.toTop svg{width:18px;height:18px;display:block;margin:0 auto 1px}

@media (max-width:640px){
  .viewer{padding:0}
  .vbar{border-radius:20px 20px 0 0;border-width:3px;border-bottom:0;padding:8px 12px}
  .vframe{border-width:3px 0 0 0;border-radius:0}
  .bookb{margin:0 4%;border-radius:0 0 22px 22px}
  .doors{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
  .door{padding:10px 4px 10px;gap:3px;border-radius:18px}
  .door .ico{width:42px;height:42px}
  .door b{font-size:clamp(12px,3.5vw,14.5px)!important;line-height:1.35}.door small{display:block;font-size:clamp(9.5px,2.6vw,11px)!important}
  .hello{display:none}
  .sec{padding:16px 14px;border-radius:24px}
  .sec .top .ico{width:56px;height:56px;border-radius:18px;padding:6px}
  .feats{grid-template-columns:minmax(0,1fr)}
  .go{font-size:15px;padding:10px 20px}
}
@media (prefers-reduced-motion:reduce){
  .art img,.petal,.twinkle,.monkey,.hello,.door,.paws span,.hint i{animation:none!important}.paws span{opacity:.8}
  .sec{opacity:1;transform:none;transition:none}.door,.go,.up,.toTop{transition:none}
}
</style>

const FILES={monosashi:"pages/monosashi.txt",calendar:"pages/calendar.txt",mochimono:"pages/mochimono.txt",azukari:"pages/azukari.txt",kyukan:"pages/kyukan.txt",urawaza:"pages/urawaza.txt"};
const cache={};let curId=null,ro=null;
const EMBED_CSS='<style>.backbtn,.mbar{display:none!important}body{padding-bottom:0!important}</style>';
const RESET='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>'+EMBED_CSS+'</head><body>';
async function getPage(id){if(cache[id])return cache[id];const r=await fetch(FILES[id]);if(!r.ok)throw new Error(r.status);cache[id]=await r.text();return cache[id]}
function fit(fr){try{const d=fr.contentDocument;if(!d)return;const h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);if(h)fr.style.height=h+"px"}catch(e){}}
let barTimer=null,barObs=null;
function hideBar(){$("#fbar").hidden=true;$("#flist").hidden=true;if(barObs){barObs.disconnect();barObs=null}clearInterval(barTimer)}
function setupBar(id,fr){
  hideBar();let d;try{d=fr.contentDocument}catch(e){return}if(!d)return;
  const bar=$("#fbar"),btn=$("#fbtn");
  if(id==="monosashi"){
    const tot=d.getElementById("total");if(!tot)return;
    bar.style.setProperty("--fc","#FF6FA5");$("#fi").innerHTML=icon("crown");$("#ftrack").hidden=true;$("#fv").textContent="くわしく見る ▲";
    const upd=()=>{$("#ft").innerHTML=`あなたの点数 <b>${tot.textContent}</b> 点`;btn.classList.toggle("roll",tot.classList.contains("roll"))};
    upd();barObs=new MutationObserver(upd);barObs.observe(tot,{childList:true,characterData:true,subtree:true,attributes:true});
    btn.onclick=()=>{const r=d.querySelector(".result");if(!r)return;const y=fr.getBoundingClientRect().top+scrollY+r.getBoundingClientRect().top-12;window.scrollTo({top:y,behavior:reduce?"auto":"smooth"})};
    bar.hidden=false;return;
  }
  if(id==="mochimono"){
    bar.style.setProperty("--fc","#2ECC85");$("#fi").innerHTML=icon("bag");$("#ftrack").hidden=false;
    const upd=()=>{const docs=[...d.querySelectorAll("#checklist .doc")];const ok=docs.filter(x=>x.querySelector("input").checked);
      $("#ft").innerHTML=`準備できたもの <b>${ok.length}/${docs.length}</b>`;$("#ffill").style.width=(docs.length?ok.length/docs.length*100:0)+"%";
      const li=(x,c)=>`<li class="${c}"><i>${c?"✓":""}</i><span>${x.querySelector(".t").textContent}</span></li>`;const ng=docs.filter(x=>!x.querySelector("input").checked);
      $("#flist").innerHTML=docs.length?`<h4>そろったもの（${ok.length}）</h4>${ok.length?`<ul>${ok.map(x=>li(x,"ok")).join("")}</ul>`:"まだありません"}<h4>まだのもの（${ng.length}）</h4>${ng.length?`<ul>${ng.map(x=>li(x,"")).join("")}</ul>`:"ぜんぶそろいました！"}`:"上で状況をえらぶと、ここに出ます。";
      $("#fv").textContent=$("#flist").hidden?"見る ▲":"とじる ▼"};
    upd();const cl=d.getElementById("checklist");if(cl){barObs=new MutationObserver(upd);barObs.observe(cl,{childList:true,subtree:true});d.addEventListener("change",()=>setTimeout(upd,30),true)}
    btn.onclick=()=>{$("#flist").hidden=!$("#flist").hidden;upd()};
    bar.hidden=false;return;
  }
}
async function openPage(id){
  const p=PAGES.find(x=>x.id===id);if(!p)return;curId=id;
  document.querySelectorAll(".door").forEach(d=>d.classList.toggle("on",d.dataset.id===id));
  const v=$("#viewer");v.hidden=false;v.style.setProperty("--cc",p.cc);v.style.setProperty("--bgc",p.bg);
  $("#vbar").innerHTML=`<span class="ico">${icon(p.ic)}</span><span class="tt"><small>${p.s.replace("|","")}</small><b>${p.t}</b></span><a href="${p.url}" target="_blank" rel="noopener">別のタブでひらく ↗</a>`;
  hideBar();
  const box=$("#vframe");const old=box.querySelector("iframe");
  if(old){old.classList.remove("in");old.classList.add("out");setTimeout(()=>old.remove(),260)}
  if(ro){ro.disconnect();ro=null}
  $("#vload").hidden=false;
  v.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  try{
    const html=await getPage(id);if(curId!==id)return;
    const fr=document.createElement("iframe");fr.title=p.t;fr.setAttribute("loading","eager");
    fr.srcdoc=RESET+html+"</body></html>";
    fr.addEventListener("load",()=>{if(curId!==id)return;$("#vload").hidden=true;fit(fr);setupBar(id,fr);
      try{fr.contentDocument.addEventListener("click",ev=>{const ln=ev.target.closest&&ev.target.closest("a[href]");if(!ln)return;const href=ln.getAttribute("href")||"";
        if(/^https?:/i.test(href)){ev.preventDefault();ev.stopPropagation();const x=document.createElement("a");x.href=href;x.target="_blank";x.rel="noopener";document.body.appendChild(x);x.click();x.remove()}},true)}catch(e){}requestAnimationFrame(()=>fr.classList.add("in"));
      try{ro=new ResizeObserver(()=>fit(fr));ro.observe(fr.contentDocument.documentElement);fr.contentDocument.addEventListener("click",()=>setTimeout(()=>fit(fr),60),true)}catch(e){}
      let n=0;const t=setInterval(()=>{fit(fr);if(++n>10)clearInterval(t)},300)});
    setTimeout(()=>box.appendChild(fr),old?240:0);
  }catch(e){$("#vload").hidden=false;$("#vload").innerHTML=`ページを読みこめませんでした。<a href="${p.url}" target="_blank" rel="noopener">こちらからひらいてください ↗</a>`}
}
$("#doors").addEventListener("click",e=>{const d=e.target.closest(".door");if(d)openPage(d.dataset.id)});
$("#doors").addEventListener("touchstart",e=>{const d=e.target.closest(".door");if(!d)return;document.querySelectorAll(".door.fuwa").forEach(x=>x!==d&&x.classList.remove("fuwa"));d.classList.add("fuwa");clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove("fuwa"),700)},{passive:true});
const toTop=()=>window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
document.addEventListener("click",e=>{if(e.target.closest(".up"))toTop()});
$("#toTop").onclick=toTop;
addEventListener("scroll",()=>$("#toTop").classList.toggle("on",scrollY>innerHeight*.6),{passive:true});
</script>
