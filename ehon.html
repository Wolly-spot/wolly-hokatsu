<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>えほんの小道</title></head><body><title>えほんの小道</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 固定の3Dステージ（小道・絵本・木）をスクロール量でカメラ前進 → 絵本タップで見開き → 施設詳細 */
:root{
  --sky1:#BFE3F7; --sky2:#FFF1DA; --grass:#9ED69A; --grass2:#7CC27A; --path:#F2D7A6; --path2:#E8C48A;
  --ink:#2C2A48; --muted:#6A6788; --paper:#FFFDF7; --paper-line:#EFE6D2; --accent:#FF6B57; --sun:#FFC53D;
  --trunk:#A8744A; --leaf:#5DB874; --leaf2:#46A35F; --gate:#E86A5A; --gate2:#C9503F; --card:#FFFFFF; --line:#E6E1D4;
  --font-display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky1:#1D2346; --sky2:#3B3460; --grass:#3E6A4A; --grass2:#33583D; --path:#8C7656; --path2:#7A6548;
  --ink:#F3F1FA; --muted:#B9B6D3; --paper:#2A2940; --paper-line:#3A3956; --accent:#FF7E6B; --sun:#FFD36A;
  --trunk:#7A5536; --leaf:#3F8A55; --leaf2:#357A49; --gate:#B9564A; --gate2:#94443A; --card:#23223A; --line:#3A3956; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky1:#1D2346; --sky2:#3B3460; --grass:#3E6A4A; --grass2:#33583D; --path:#8C7656; --path2:#7A6548;
  --ink:#F3F1FA; --muted:#B9B6D3; --paper:#2A2940; --paper-line:#3A3956; --accent:#FF7E6B; --sun:#FFD36A;
  --trunk:#7A5536; --leaf:#3F8A55; --leaf2:#357A49; --gate:#B9564A; --gate2:#94443A; --card:#23223A; --line:#3A3956; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--sky1);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
#spacer{height:900vh}
.stage{position:fixed;inset:0;overflow:hidden;perspective:700px;perspective-origin:50% 38%;
  background:linear-gradient(var(--sky1) 0 40%,var(--sky2) 62%,var(--grass) 62.1%)}
.sun{position:absolute;right:12%;top:9%;width:70px;height:70px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 14px color-mix(in srgb,var(--sun) 25%,transparent)}
.hill{pointer-events:none;position:absolute;bottom:37%;width:70%;height:22%;border-radius:50% 50% 0 0;background:var(--grass2);opacity:.7}
.hill.h1{left:-18%}.hill.h2{right:-22%;height:16%}
.world{position:absolute;left:50%;top:62%;transform-style:preserve-3d;will-change:transform}
.world>*{position:absolute;transform-style:preserve-3d}
.ground{pointer-events:none;left:-170px;top:0;width:340px;transform-origin:top center;
  background:repeating-linear-gradient(var(--path) 0 120px,var(--path2) 120px 240px);border-left:10px solid var(--grass2);border-right:10px solid var(--grass2)}
.book{width:200px;height:270px;left:-100px;top:-270px;cursor:pointer;border:0;padding:0;background:none;transform-origin:bottom center}
.book .face{position:absolute;inset:0;border-radius:8px 16px 16px 8px;background:var(--bc);
  box-shadow:inset 14px 0 0 rgba(0,0,0,.12),inset 18px 0 0 rgba(255,255,255,.25),0 18px 0 -6px rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 14px 16px 26px;color:#2C2A48;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.book .face::after{content:"";position:absolute;right:-8px;top:8px;bottom:8px;width:10px;border-radius:0 6px 6px 0;
  background:repeating-linear-gradient(#FFFDF7 0 3px,#EADFC8 3px 4px)}
.book .t{font-family:var(--font-display);font-size:26px;line-height:1.15;text-align:center;background:#FFFDF7;border-radius:12px;padding:6px 10px;width:100%}
.book .t small{display:block;font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.12em;color:#6A6788}
.book svg{width:96px;height:96px}
.book .n{font-weight:700;font-size:12px;background:rgba(255,253,247,.85);border-radius:999px;padding:2px 10px}
.book.near .face{transform:translateY(-14px) rotateX(-4deg)}
.book .hint{position:absolute;left:50%;top:-44px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--paper);
  font-weight:700;font-size:13px;border-radius:999px;padding:4px 12px;opacity:0;transition:opacity .3s}
.book.near .hint{opacity:1}
.post{width:16px;height:80px;left:-8px;top:-80px;background:var(--trunk);border-radius:6px}
.tree{width:120px;height:170px;left:-60px;top:-170px;pointer-events:none}
.tree i{position:absolute;left:50%;bottom:0;width:18px;height:60px;margin-left:-9px;background:var(--trunk);border-radius:6px}
.tree b{position:absolute;left:0;right:0;top:0;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--leaf),var(--leaf2))}
.sign{width:240px;left:-120px;top:-210px;text-align:center;pointer-events:none}
.sign div{background:var(--paper);border:4px solid var(--trunk);border-radius:16px;padding:10px;font-family:var(--font-display);font-size:20px;color:var(--ink)}
.sign i{display:block;width:12px;height:110px;margin:0 auto;background:var(--trunk)}
.endsign{pointer-events:auto}
.endsign a{display:inline-block;margin-top:6px;font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--accent)}

/* HUD */
.hud{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;pointer-events:none;z-index:3}
.hud div{pointer-events:auto;background:color-mix(in srgb,var(--paper) 90%,transparent);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:13px;display:flex;gap:10px;align-items:center}
.hud .bar{width:110px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.hud .bar span{display:block;height:100%;background:var(--accent);width:0}
.walker{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:58px;margin-left:-29px;z-index:2;pointer-events:none}
.walker svg{display:block;width:58px;height:70px}
.walker.walk .legL{animation:legA .45s ease-in-out infinite alternate}
.walker.walk .legR{animation:legA .45s ease-in-out infinite alternate-reverse}
@keyframes legA{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.legL,.legR{transform-box:fill-box;transform-origin:top center}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;perspective:900px;background:linear-gradient(var(--sky1) 0 60%,var(--grass) 60%)}
.gate .frame{position:relative;width:min(84vw,460px);aspect-ratio:4/5;max-width:100%}
.gate .arch{position:absolute;left:-6%;right:-6%;top:-12%;height:22%;background:var(--gate2);border-radius:120px 120px 12px 12px;display:grid;place-items:center;
  font-family:var(--font-display);color:#FFFDF7;font-size:clamp(20px,5vw,30px);z-index:2}
.gate .pillar{position:absolute;top:0;bottom:0;width:9%;background:var(--gate2);border-radius:10px}
.gate .pillar.l{left:-6%}.gate .pillar.r{right:-6%}
.gate .door{position:absolute;top:10%;bottom:0;width:50%;background:repeating-linear-gradient(90deg,var(--gate) 0 22px,var(--gate2) 22px 28px);
  transition:transform 1.3s cubic-bezier(.6,0,.3,1)}
.gate .door.l{left:0;transform-origin:left center;border-radius:14px 0 0 0}
.gate .door.r{right:0;transform-origin:right center;border-radius:0 14px 0 0}
.gate .door::after{content:"";position:absolute;top:45%;width:14px;height:14px;border-radius:50%;background:var(--sun)}
.gate .door.l::after{right:12px}.gate .door.r::after{left:12px}
.gate .through{position:absolute;inset:10% 0 0;background:linear-gradient(var(--sky2),var(--path));border-radius:14px 14px 0 0;display:grid;place-items:center}
.gate .through span{font-family:var(--font-display);font-size:18px;color:var(--ink)}
.gate.open .door.l{transform:rotateY(-105deg)}
.gate.open .door.r{transform:rotateY(105deg)}
.gate.enter{transition:transform 1s ease-in,opacity .8s ease-in .3s;transform:scale(2.6);opacity:0}
.gate .skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px;font-weight:700;font-size:13px;cursor:pointer}

/* ---------- open book ---------- */
.reader{position:fixed;inset:0;z-index:15;background:color-mix(in srgb,#1B1A30 55%,transparent);display:grid;place-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.spread{position:relative;width:min(960px,100%);height:min(640px,calc(100dvh - 40px));perspective:1600px;display:grid;grid-template-columns:1fr 1fr;
  animation:rise .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes rise{from{transform:translateY(40px) scale(.9)}to{transform:none}}
.page{background:var(--paper);overflow:auto;padding:26px 26px 22px;min-width:0;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--paper-line) 31px 32px)}
.page.left{border-radius:18px 0 0 18px;box-shadow:inset -18px 0 24px -16px rgba(0,0,0,.25)}
.page.right{border-radius:0 18px 18px 0;box-shadow:inset 18px 0 24px -16px rgba(0,0,0,.25)}
.cover{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:left center;transform-style:preserve-3d;
  animation:flip 1s cubic-bezier(.5,0,.2,1) .15s forwards;z-index:4;pointer-events:none}
.cover>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:0 18px 18px 0}
.cover .front{background:var(--bc);display:grid;place-items:center;font-family:var(--font-display);font-size:34px;color:#2C2A48}
.cover .back{background:var(--paper);transform:rotateY(180deg);border-radius:18px 0 0 18px}
@keyframes flip{to{transform:rotateY(-180deg)}}
.close{position:absolute;right:10px;top:10px;z-index:6;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:20px;line-height:1;cursor:pointer}
.ptitle{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.2;margin:4px 0 6px}
.kicker{font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.illu{display:grid;place-items:center;margin:10px 0 6px}
.illu svg{width:120px;height:120px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.stats button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;cursor:pointer}
.stats button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lead{font-size:14px;color:var(--muted);margin:6px 0 0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;
  background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.list button:hover,.list button:focus-visible{border-color:var(--ink)}
.list .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#2C2A48}
.list b{font-size:14px;overflow-wrap:anywhere;line-height:1.45}
.list small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.list .arrow{color:var(--muted);font-weight:700}
.detail h3{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.3;margin:6px 0 10px;overflow-wrap:anywhere}
.detail dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0 0 12px;font-size:14px}
.detail dt{color:var(--muted);font-weight:700}.detail dd{margin:0;overflow-wrap:anywhere}
.detail .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.detail .tag{font-size:12px;font-weight:700;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-radius:8px;padding:1px 8px}
.detail .acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:0 10px;font-weight:700;font-size:12px}
.pill.lic{background:color-mix(in srgb,#2FAE7E 18%,transparent);color:#2A9A70}
.pill.gai{background:color-mix(in srgb,#4F7FE0 18%,transparent);color:#4F7FE0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:30}
.demo{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:3;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;color:var(--muted)}

@media (max-width:720px){
  .spread{display:block;height:calc(100dvh - 40px);overflow:auto;border-radius:18px;background:var(--paper)}
  .page{overflow:visible}
  .page.left{border-radius:18px 18px 0 0;box-shadow:none;border-bottom:3px dashed var(--paper-line);padding-bottom:14px}
  .page.right{border-radius:0 0 18px 18px;box-shadow:none}
  .illu svg{width:80px;height:80px}
  .cover{position:fixed;left:12px;right:12px;width:auto;top:calc(20px + env(safe-area-inset-top,0px));bottom:20px}
  .cover>div{border-radius:18px}
  .close{position:sticky;float:right;top:0}
}
@media (prefers-reduced-motion:reduce){
  .gate .door,.gate.enter{transition:none}.cover{animation-duration:.01s}.spread{animation:none}.walker.walk .legL,.walker.walk .legR{animation:none}
}
</style>

<div class="stage" aria-hidden="false">
  <div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div>
  <div class="world" id="world"></div>
</div>
<div id="spacer"></div>
<div class="walker" id="walker" aria-hidden="true">
  <svg viewBox="0 0 58 70"><g fill="#2C2A48">
    <rect class="legL" x="20" y="48" width="7" height="18" rx="3.5"/><rect class="legR" x="31" y="48" width="7" height="18" rx="3.5"/></g>
    <ellipse cx="29" cy="40" rx="16" ry="14" fill="#FF6B57"/>
    <circle cx="29" cy="20" r="14" fill="#FFE0C2"/><path d="M15 18a14 14 0 0 1 28 0c-6-4-22-4-28 0z" fill="#FFC53D"/>
    <circle cx="24" cy="21" r="2" fill="#2C2A48"/><circle cx="34" cy="21" r="2" fill="#2C2A48"/>

</div>
<div class="hud"><div><span id="where">入口</span><span class="bar"><span id="prog"></span></span><span id="hudhint">スクロールで進む</span></div></div>

    <div class="arch">えほんの小道</div>

</div>

<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-label="えほん"></div>

 sun:'<circle cx="50" cy="50" r="22" fill="#FFC53D"/><g stroke="#FF9F1C" stroke-width="7" stroke-linecap="round"><path d="M50 8v12M50 80v12M8 50h12M80 50h12M20 20l8 8M72 72l8 8M20 80l8-8M72 28l8-8"/></g>',
 train:'<rect x="16" y="26" width="68" height="44" rx="12" fill="#4F9FE0"/><rect x="24" y="34" width="20" height="16" rx="4" fill="#FFFDF7"/><rect x="52" y="34" width="20" height="16" rx="4" fill="#FFFDF7"/><circle cx="32" cy="76" r="8" fill="#2C2A48"/><circle cx="68" cy="76" r="8" fill="#2C2A48"/>',
 flower:'<g fill="#FF6B8A"><circle cx="50" cy="28" r="14"/><circle cx="72" cy="46" r="14"/><circle cx="64" cy="72" r="14"/><circle cx="36" cy="72" r="14"/><circle cx="28" cy="46" r="14"/></g><circle cx="50" cy="52" r="12" fill="#FFC53D"/>',
 fish:'<path d="M14 50c18-26 50-26 64 0-14 26-46 26-64 0z" fill="#4F9FE0"/><path d="M78 50l14-14v28z" fill="#4F9FE0"/><circle cx="32" cy="46" r="5" fill="#FFFDF7"/>',
 star:'<path d="M50 12l11 23 25 3-18 17 5 25-23-12-23 12 5-25-18-17 25-3z" fill="#FFC53D" stroke="#E8962E" stroke-width="3" stroke-linejoin="round"/>',
 petal:'<g fill="#FF8FB8"><path d="M50 20c10 8 10 22 0 30-10-8-10-22 0-30z"/><path d="M50 20c10 8 10 22 0 30-10-8-10-22 0-30z" transform="rotate(72 50 50)"/><path d="M50 20c10 8 10 22 0 30-10-8-10-22 0-30z" transform="rotate(144 50 50)"/><path d="M50 20c10 8 10 22 0 30-10-8-10-22 0-30z" transform="rotate(216 50 50)"/><path d="M50 20c10 8 10 22 0 30-10-8-10-22 0-30z" transform="rotate(288 50 50)"/></g><circle cx="50" cy="50" r="6" fill="#FFC53D"/>',
 ball:'<circle cx="50" cy="50" r="32" fill="#FFFDF7" stroke="#2C2A48" stroke-width="4"/><path d="M50 30l12 9-5 14H43l-5-14z" fill="#2C2A48"/>',
 house:'<path d="M18 48 50 20l32 28v32H18z" fill="#FF6B57"/><rect x="40" y="56" width="20" height="24" rx="4" fill="#FFFDF7"/>',
 tree:'<rect x="44" y="58" width="12" height="26" rx="4" fill="#A8744A"/><circle cx="50" cy="42" r="26" fill="#46A35F"/>',
 moon:'<path d="M70 66A30 30 0 1 1 46 18a24 24 0 0 0 24 48z" fill="#FFC53D"/>'
};
const CATL={kouritsu:"公立保育所",shiritsu:"私立保育所",kodomo:"認定こども園",youchien:"幼稚園",shokibo:"小規模保育",jigyo:"事業所内保育",katei:"家庭的保育",
 nursery:"ナーサリールーム",kateihoiku:"家庭保育室",kigyo:"企業主導型保育",ichiji:"一時預かり専門",baby:"ベビーホテル",gai:"その他の認可外"};
const CATC={kouritsu:"#9DDBA6",shiritsu:"#FFB3A3",kodomo:"#BBA8F6",youchien:"#8CCBF3",shokibo:"#FFD47A",jigyo:"#88D9BF",katei:"#FFC0DD",
 nursery:"#A9C2F5",kateihoiku:"#D9B8F0",kigyo:"#9FD6D2",ichiji:"#FFCB96",baby:"#B9B9F0",gai:"#C9CED9"};
const CATS=Object.keys(CATL);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=m=>`<svg viewBox="0 0 100 100" aria-hidden="true">${MOTIF[m]}</svg>`;

/* ---------- build world ---------- */
const GAP=520, N=WARDS.length, DEPTH=(N+1.6)*GAP;
let SIDE=innerWidth<720?150:290;
const world=$("#world"), items=[];
function place(el,x,z,ry){el._x=x;el._z=z;el._ry=ry||0;items.push(el);world.appendChild(el)}
function buildWorld(){
  world.innerHTML="";items.length=0;SIDE=innerWidth<720?140:290;
  const g=document.createElement("div");g.className="ground";g.style.height=(DEPTH+2600)+"px";
  g.style.transform=`translateZ(800px) rotateX(-90deg)`;world.appendChild(g);
  const s=document.createElement("div");s.className="sign";s.innerHTML="<div>ようこそ えほんの小道へ</div><i></i>";place(s,0,-GAP*0.45);
  WARDS.forEach(([w,key,col,m],i)=>{
    const n=DATA.filter(r=>r.w===w).length;
    const left=i%2===0, x=left?-SIDE:SIDE, z=-(i+1)*GAP;
    const b=document.createElement("button");b.className="book";b.dataset.w=w;b.style.setProperty("--bc",col);
    b.setAttribute("aria-label",`${w}区のえほんをひらく（${n}か所）`);
    b.innerHTML=`<span class="hint">タップしてひらく</span><span class="face"><span class="t"><small>${String(i+1).padStart(2,"0")} / 10</small>${w}区の<br>えほん</span>${svg(m)}<span class="n num">${n}か所</span></span>`;
    b.onclick=()=>openWard(w);
    place(b,x,z,left?28:-28);
    const t=document.createElement("div");t.className="tree";t.innerHTML="<b></b><i></i>";
    place(t,left?SIDE+60:-SIDE-60,z+GAP*0.5);
    const t2=document.createElement("div");t2.className="tree";t2.innerHTML="<b></b><i></i>";
    place(t2,left?-SIDE-150:SIDE+150,z-GAP*0.3);
  });
  const e=document.createElement("div");e.className="sign endsign";
  e.innerHTML=`<div>小道のおわり<br><a href="${MAPURL}" target="_blank" rel="noopener">地図ページで全722か所を見る ↗</a></div><i></i>`;
  place(e,0,-(N+1.2)*GAP);
}

/* ---------- camera ---------- */
let camZ=0,target=0,lastWalk=0;
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  const p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
  target=p*(DEPTH-GAP*0.9);
  $("#prog").style.width=(p*100)+"%";
  lastWalk=performance.now();
}
function frame(){
  camZ+= (target-camZ)*0.12;
  const bob=Math.sin(camZ/70)*5;
  world.style.transform=`translate3d(0,${bob}px,${camZ}px)`;
  let near=null,best=1e9;
  for(const el of items){
    const dz=el._z+camZ; // distance in front of camera is negative
    const vis=dz<520&&dz>-3800;
    el.style.visibility=vis?"visible":"hidden";
    if(!vis)continue;
    el.style.opacity=Math.max(0,Math.min(1,(3800+dz)/1400));
    el.style.transform=`translate3d(${el._x}px,0,${el._z}px) rotateY(${el._ry}deg)`;
    if(el.classList.contains("book")&&dz<120&&dz>-760){if(dz>-best||near===null){best=-dz;near=el}}
  }
  items.forEach(el=>el.classList&&el.classList.remove("near"));
  if(near){near.classList.add("near");$("#where").textContent=near.dataset.w+"区のまえ";$("#hudhint").textContent="本をタップ"}
  else{$("#where").textContent=camZ<GAP*0.6?"入口":"小道を歩いています";$("#hudhint").textContent="スクロールで進む"}
  $("#walker").classList.toggle("walk",performance.now()-lastWalk<220||Math.abs(target-camZ)>4);
  requestAnimationFrame(frame);
}

/* ---------- gate ---------- */
function enter(skip){
  const g=$("#gate");if(!g||g.dataset.done)return;g.dataset.done=1;
  if(skip){g.remove();return}
  g.classList.add("open");
  setTimeout(()=>g.classList.add("enter"),1100);
  setTimeout(()=>g.remove(),2200);
}
$("#skip").onclick=()=>enter(true);

/* ---------- reader ---------- */
const R=$("#reader");let cur={w:null,cat:"",id:null};
function wardOf(w){return WARDS.find(x=>x[0]===w)}
function openWard(w,cat,id,noAnim){
  cur={w,cat:cat||"",id:id??null};
  const [,key,col,m]=wardOf(w);
  const rows=DATA.filter(r=>r.w===w);
  const counts={};rows.forEach(r=>counts[r.c]=(counts[r.c]||0)+1);
  const lic=rows.filter(r=>r.lic).length;
  R.innerHTML=`<div class="spread${noAnim?"":" cover-on"}" id="spread" style="--bc:${col}">
    ${noAnim?"":`<div class="cover"><div class="front">${w}区</div><div class="back"></div></div>`}
    <button class="close" id="closeR" aria-label="本をとじる">×</button>
    <div class="page left">
      <div class="kicker">${String(WARDS.indexOf(wardOf(w))+1).padStart(2,"0")} / 10 さつめ</div>
      <h2 class="ptitle">${w}区のえほん</h2>
      <div class="illu">${svg(m)}</div>
      <p class="lead">${w}区には、子どもを預けられる場所が <b class="num">${rows.length}か所</b> あります（認可 ${lic}・認可外 ${rows.length-lic}）。種類を押すと一覧が切り替わります。</p>
      <div class="stats" id="stats"><button data-c="" class="${cur.cat?"":"on"}">ぜんぶ ${rows.length}</button>${CATS.filter(c=>counts[c]).map(c=>`<button data-c="${c}" class="${cur.cat===c?"on":""}">${CATL[c]} ${counts[c]}</button>`).join("")}</div>
    </div>
    <div class="page right" id="right"></div>
  </div>`;
  R.hidden=false;document.body.style.overflow="hidden";
  $("#closeR").onclick=closeReader;
  $("#stats").onclick=e=>{const b=e.target.closest("button");if(!b)return;cur.cat=b.dataset.c;cur.id=null;
    document.querySelectorAll("#stats button").forEach(x=>x.classList.toggle("on",x===b));drawRight();if(innerWidth<720)$("#right").scrollIntoView({behavior:"smooth"})};
  drawRight();
  setHash(cur.id!=null?"f"+cur.id:"w-"+key);
  setTimeout(()=>{const c=document.querySelector("#spread .cover");if(c)c.remove()},noAnim?0:1200);
  setTimeout(()=>$("#closeR")&&$("#closeR").focus(),50);
}
function drawRight(){
  const right=$("#right");
  if(cur.id!=null){
    const r=DATA[cur.id];
    const f=[];
    f.push(["種類",esc(CATL[r.c])+(r.sub?`（${esc(r.sub)}）`:"")]);
    if(r.age)f.push(["年齢",esc(r.age.replace("-","〜"))]);
    if(r.h)f.push(["時間",esc(r.h.replace("-","〜"))+"（平日）"]);
    if(r.cap)f.push(["定員",r.cap+"人"]);
    f.push(["住所","さいたま市"+esc(r.a)]);
    if(r.t)f.push(["電話",`<span class="num">${esc(r.t)}</span>`]);
    const tags=[r.g?"系列："+r.g:"",r.note,r.hj].filter(Boolean);
    const mq=encodeURIComponent("さいたま市"+r.a.split(" ")[0]+" "+r.n);
    right.innerHTML=`<div class="detail">
      <button class="btn ghost" id="backL">← ${esc(r.w)}区のページにもどる</button>
      <h3>${esc(r.n)}</h3>
      <span class="pill ${r.lic?"lic":"gai"}">${r.lic?"認可":"認可外"}</span>
      <dl style="margin-top:12px">${f.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>
      ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
      <div class="acts"><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${mq}" target="_blank" rel="noopener">地図で見る ↗</a>${r.t?`<button class="btn ghost" id="cp">電話番号をコピー</button>`:""}</div>
    </div>`;
    $("#backL").onclick=()=>{cur.id=null;drawRight();setHash("w-"+wardOf(cur.w)[1])};
    const cp=$("#cp");if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(r.t).then(()=>toast("コピーしました："+r.t),()=>toast(r.t))}catch(e){toast(r.t)}};
    setHash("f"+r.id);right.scrollTop=0;return;
  }
  const order=Object.fromEntries(CATS.map((c,i)=>[c,i]));
  const rows=DATA.filter(r=>r.w===cur.w&&(!cur.cat||r.c===cur.cat)).sort((a,b)=>order[a.c]-order[b.c]||a.n.localeCompare(b.n,"ja"));
  right.innerHTML=`<div class="kicker">${cur.cat?esc(CATL[cur.cat]):"ぜんぶの預け先"}・${rows.length}か所</div>
    <h2 class="ptitle" style="font-size:22px">どこを見る？</h2>
    <ul class="list">${rows.map(r=>`<li><button data-id="${r.id}"><span class="dot" style="background:${CATC[r.c]}">${r.lic?"認":"外"}</span><span><b>${esc(r.n)}</b><small>${esc(CATL[r.c])}${r.age?" ・ "+esc(r.age.replace("-","〜")):""}</small></span><span class="arrow">›</span></button></li>`).join("")}</ul>`;
  right.querySelector(".list").onclick=e=>{const b=e.target.closest("button");if(!b)return;cur.id=+b.dataset.id;drawRight()};
  right.scrollTop=0;
}
function closeReader(){R.hidden=true;R.innerHTML="";document.body.style.overflow="";setHash("");const b=document.querySelector(`.book[data-w="${cur.w}"]`);if(b)b.focus({preventScroll:true})}
addEventListener("keydown",e=>{if(e.key==="Escape"&&!R.hidden)closeReader()});
R.addEventListener("click",e=>{if(e.target===R)closeReader()});
function setHash(h){try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search)}catch(e){}}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function fromHash(){
  const h=location.hash.slice(1);
  let m=h.match(/^f(\d+)$/);if(m&&DATA[+m[1]]){enter(true);const r=DATA[+m[1]];openWard(r.w,"",r.id,true);return}
  m=h.match(/^w-([a-z]+)$/);if(m){const w=WARDS.find(x=>x[1]===m[1]);if(w){enter(true);openWard(w[0],"",null,true)}}
}

buildWorld();onScroll();camZ=target;
addEventListener("scroll",onScroll,{passive:true});
addEventListener("resize",()=>{buildWorld();onScroll()});
requestAnimationFrame(frame);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(location.hash)fromHash();else setTimeout(()=>enter(reduce),reduce?0:700);
addEventListener("hashchange",fromHash);
</script>

<style>
.backbtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:50;display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.94);color:#2E2B4F;border:2px solid #E2E6F3;border-radius:999px;padding:4px 14px 4px 8px;font:700 13px/1.5 "Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  box-shadow:0 3px 10px rgba(46,43,79,.14);cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.backbtn svg{width:20px;height:20px;flex:0 0 auto}
.backbtn:hover,.backbtn:focus-visible{transform:translateY(-2px) scale(1.06);box-shadow:0 6px 14px rgba(46,43,79,.18)}
.backbtn:active{transform:scale(.94)}
.backbtn:focus-visible{outline:3px solid #3DB2F2;outline-offset:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .backbtn{background:rgba(38,39,74,.94);color:#F4F2FF;border-color:#3A3B62}}
:root[data-theme="dark"] .backbtn{background:rgba(38,39,74,.94);color:#F4F2FF;border-color:#3A3B62}
@media (prefers-reduced-motion:reduce){.backbtn{transition:none}}
</style>
<button type="button" class="backbtn" id="backbtn" aria-label="前のページにもどる"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#FF6FA5"/><path d="M13.5 7.5 9 12l4.5 4.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>もどる</button>
<script>
(function(){var b=document.getElementById("backbtn");if(!b)return;
b.addEventListener("click",function(){
  var before=location.href,y=window.scrollY;
  try{if(history.length>1){history.back();}}catch(e){}
  setTimeout(function(){if(location.href===before&&window.scrollY===y){window.scrollTo({top:0,behavior:"smooth"});}},350);
});})();
</script>
<style>.gate .skip{right:auto!important;left:max(16px,env(safe-area-inset-left,0px))!important}</style><script>(function(){var r=document.getElementById("reader"),b=document.getElementById("backbtn");if(!r||!b)return;new MutationObserver(function(){b.hidden=!r.hidden}).observe(r,{attributes:true,attributeFilter:["hidden"]});})();</script>
</body></html>
